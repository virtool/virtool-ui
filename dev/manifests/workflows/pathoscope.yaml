# `ghcr.io/virtool/ts-pathoscope` is not published from this repository — CI
# builds the image but has no publish job, because `virtool/workflow-pathoscope`
# still releases the pathoscope workflow. The `:latest` tag below does resolve,
# but it is the leftover of a short-lived publish job from before the port
# landed and carries the tools with no workflow code. This ScaledJob is only
# usable under `tilt up -- --pathoscope`, which builds the image locally.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: pathoscope
  labels:
    app.kubernetes.io/name: pathoscope
    app.kubernetes.io/component: workflow
    app.kubernetes.io/part-of: virtool
    app.virtool.ca/workflow-name: pathoscope
    app.virtool.ca/workflow-size: large
spec:
  jobTargetRef:
    template:
      metadata:
        labels:
          app.kubernetes.io/name: pathoscope
          app.kubernetes.io/component: workflow
          app.kubernetes.io/part-of: virtool
      spec:
        containers:
          - name: workflow-pathoscope
            image: ghcr.io/virtool/ts-pathoscope:latest
            env:
              - name: VT_MEM
                value: "6"
              - name: VT_PROC
                value: "2"
              - name: VT_WORKFLOW
                value: pathoscope
            resources:
              limits:
                cpu: 3000m
                memory: 7Gi
              requests:
                cpu: 2000m
                memory: 6Gi
  triggers:
    - type: metrics-api
      metadata:
        url: "http://virtool-jobs-api-service.default.svc.cluster.local/jobs/counts"
        valueLocation: "pending.pathoscope"
        targetValue: "1"
        activationTargetValue: "0"
